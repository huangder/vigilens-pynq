# ---- 年龄 × 指标耦合的证据权重（**本功能最关键的一条科学依据**）--------------
# 依据（真实可核实，见 report/research/age_fatigue_reference_sources.md §3）：
#   Cai et al. 2021, Sci Rep 11:21561, DOI 10.1038/s41598-021-99133-y（CC BY，全文已读）：
#     29 h 完全睡眠剥夺 + 实车，年轻组 16 人 vs 老年组 17 人。原文结论：
#     "Ocular measures of drowsiness, including blink duration, number of long eye
#      closures and PERCLOS increased following sleep loss **for younger adults only**
#      (p < 0.05)." 老年组仍有驾驶损害（车道偏离 3.5×），但**眼部指标不升高**。
#   独立佐证：Abe 2023, Sleep Advances 4(1):zpad006（CC BY，全文已读）把
#     "in older adults" 明确列为 PERCLOS **不**随困倦变化的情形之一。
# ⇒ 含义：**统一的 PERCLOS 阈值会对老年用户系统性漏报**（false negative），
#    而漏报在安全方向上是更坏的错误。因此本模型对"眼部证据"按年龄**下调权重**，
#    并相对提高非眼部证据（哈欠 / 姿态漂移）的权重。
# ⚠️ 下面的具体数值是**占位值**：文献给的是"方向与显著性"，没有给可移植的权重。
#    真正标定需要本设备上带年龄标注的 session（当前不存在，见 docs/28 §9（未验证清单））。
age_scenario: reading               # 眨眼率的场景口径（reading / primary_gaze / conversation）。
                                    #   依据 Doughty 2001（Optom Vis Sci 78(10):712-725，题录已核）：
                                    #   95% 参考带 reading 1.4~14.4、primary gaze 8.0~21.0、
                                    #   conversation 10.5~32.5 blinks/min —— **场景差 5.8 倍**，
                                    #   比年龄差异大得多。本项目是"桌面专注"场景 → reading。
                                    #   不写明场景就引用眨眼率 = 结论不可复现（原文明确反对笼统给值）。
couple_eye_sensitivity_default: 1.0 # 眼部证据（PERCLOS / 长闭眼 / 眨眼率）的年龄权重基准
couple_eye_sensitivity_older: 0.5   # 60+ 组的眼部证据权重（占位值；方向有文献依据，数值没有）
couple_non_eye_sensitivity_older: 1.2   # 60+ 组的非眼部证据权重（哈欠/姿态），同上为占位值
couple_gain_pose_drift: 0.5         # 姿态漂移项的增益：在阈值内的漂移也计入弱证据
                                    #   （老年组的损害被作者归因于 inattention/distraction，
                                    #    而姿态与可见率正是本项目里"非眼动"的可测代理）
couple_trend_ref_per_min: 0.10      # 趋势项的基准：PERCLOS 每分钟上升多少算 1 个尺度。
                                    #   ⚠️ 未标定，占位值。


