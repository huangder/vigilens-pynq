[pytest]
# 测试入口固定为 backend/tests（在仓库根执行 `pytest` 即可）
testpaths = backend/tests

# -ra        汇总所有非通过项的原因（CI 里一眼看到为什么红）
# -p no:cacheprovider
#            禁用 .pytest_cache。原因：该目录由 pytest 用"随机名目录 + 改名"的方式创建，
#            在受限沙箱/受限 ACL 的机器上会 WinError 5 拒绝访问并刷一堆 PytestCacheWarning。
#            我们没有用 --lf/--ff 的需求，直接关掉，测试输出干净。
addopts = -ra -p no:cacheprovider
